name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-docker:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .devcontainer
        tags: ghcr.io/ltowarek/esp-opentelemetry-cpp-devcontainer
        file: ./.devcontainer/Dockerfile
        push: true

  build:
    needs: build-docker
    permissions:
      contents: read
      actions: read

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - project: traces example
            path: examples/traces
            qemu: true
          - project: metrics example
            path: examples/metrics
            qemu: true
          - project: logs example
            path: examples/logs
            qemu: true
          - project: profiles example
            path: examples/profiles
            qemu: true
          # Profiling plus a signal on the console exporters: the cJSON
          # JsonWriter is compiled while the SDK's OTLP tree is not.
          - project: profiles example (with tracing)
            path: examples/profiles
            build_args: -B build_tracing -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.tracing" -D SDKCONFIG=build_tracing/sdkconfig
            cache_id: examples/profiles-tracing
          - project: otlp example
            path: examples/otlp
            no_protobuf: true
          # Same example, protobuf serializer. Its own build directory and
          # sdkconfig so the two configurations do not fight over one cache.
          - project: otlp example (protobuf encoding)
            path: examples/otlp
            build_args: -B build_protobuf -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.protobuf" -D SDKCONFIG=build_protobuf/sdkconfig
            # Two matrix entries share examples/otlp; the ccache key is keyed
            # on the path, so the second needs one of its own.
            cache_id: examples/otlp-protobuf
          - project: jtag example
            path: examples/jtag
          - project: propagation example
            path: examples/propagation

    container:
      image: ghcr.io/ltowarek/esp-opentelemetry-cpp-devcontainer
      options: --user root
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ runner.os }}-idf-${{ matrix.cache_id || matrix.path }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-idf-${{ matrix.cache_id || matrix.path }}-
          ccache-${{ runner.os }}-idf-

    - name: Build
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        source $IDF_PATH/export.sh
        idf.py ${{ matrix.build_args }} build
      working-directory: ${{ matrix.path }}

    - name: Assert the image links no protobuf or Abseil
      if: ${{ matrix.no_protobuf }}
      working-directory: ${{ matrix.path }}
      run: |
        source $IDF_PATH/export.sh
        "$GITHUB_WORKSPACE/tools/check_no_protobuf.sh" build/*.elf

    - name: Run in QEMU
      if: ${{ matrix.qemu }}
      working-directory: ${{ matrix.path }}
      run: |
        source $IDF_PATH/export.sh
        bash test_qemu.sh

  symbolizer-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run symbolizer unit tests
      run: |
        pip install --quiet pytest
        python -m pytest tools/symbolizer -q

  ci-status:
    needs: [build-docker, build, symbolizer-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any needed job did not succeed
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
      run: exit 1
